[package]
name = "openui-desktop"
version = "0.1.0"
description = "Native Windows desktop generative UI chat, built with Tauri v2 and OpenUI."
authors = ["OpenUI Desktop"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "openui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "stream",
  "json",
] }
futures-util = "0.3.34"
uuid = { version = "1.29.3", features = ["v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.154"

[features]
# Enabled by `tauri build` so the frontend is served from the binary instead of
# the dev server. `cargo build` alone stays in dev mode and needs no `dist/`.
custom-protocol = ["tauri/custom-protocol"]
